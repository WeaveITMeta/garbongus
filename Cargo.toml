[package]
name = "garbongus"
version = "0.2.1"
edition = "2021"
authors = ["WeaveITMeta"]
description = "Fluid mechanics library: pipe sizing, pump power, Manning equation, multi-segment pipelines, seawater properties, Bernoulli, Darcy-Weisbach, vacuum lift, capillary rise. Pure Rust, zero dependencies."
license = "MIT"
keywords = ["fluid-mechanics", "hydraulics", "pipeline", "pump-power", "pipe-flow"]
categories = ["science", "mathematics", "algorithms"]
readme = "README.md"
repository = "https://github.com/WeaveITMeta/garbongus"
homepage = "https://github.com/WeaveITMeta/garbongus"
documentation = "https://docs.rs/garbongus"

[lib]
name = "garbongus"
path = "src/lib.rs"

[features]
default = ["std"]
std = []

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "fluid_benchmarks"
harness = false
